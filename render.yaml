# Free-tier prototype only. Free Postgres expires after 30 days; free Key Value is non-persistent.
services:
  - type: web
    name: detectionops-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: feature/phase-0-foundation
    plan: free
    region: singapore
    autoDeployTrigger: off
    healthCheckPath: /ready
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: detectionops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: detectionops-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

  - type: keyvalue
    name: detectionops-redis
    region: singapore
    plan: free
    ipAllowList: []

  - type: web
    runtime: static
    name: detectionops-web
    rootDir: frontend
    branch: feature/phase-0-foundation
    autoDeployTrigger: off
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: detectionops-db
    databaseName: detectionops
    plan: free
    region: singapore
