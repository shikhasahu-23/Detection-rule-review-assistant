# Initial free-tier prototype. This does not provision paid workers or datastores.
services:
  - type: web
    name: detectionops-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: feature/phase-0-foundation
    plan: free
    region: singapore
    healthCheckPath: /ready
    startCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    runtime: static
    name: detectionops-web
    rootDir: frontend
    branch: feature/phase-0-foundation
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
