name: Refresh public threat intelligence

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 Asia/Kolkata
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh_static_intelligence.py"
      - ".github/workflows/refresh-static-intelligence.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: static-intelligence-refresh
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: https://shikhasahu-23.github.io/ThreatWeave/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh authoritative public sources
        run: python scripts/refresh_static_intelligence.py
      - name: Validate refreshed datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("frontend/public/data")
          for name in ("summary.json", "indicators.json", "feeds.json", "attack-techniques.json"):
              value = json.loads((root / name).read_text())
              assert value is not None, name
          assert json.loads((root / "indicators.json").read_text())
          assert json.loads((root / "attack-techniques.json").read_text())
          print("Static intelligence JSON validated")
          PY
      - name: Commit refreshed public data safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/summary.json frontend/public/data/indicators.json frontend/public/data/feeds.json frontend/public/data/attack-techniques.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(intel): refresh CISA KEV and MITRE ATT&CK datasets"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "::error::Unable to push refreshed data after three attempts"
                exit 1
              fi
              sleep 5
            done
          else
            echo "No public intelligence changes."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build refreshed portfolio
        working-directory: frontend
        env:
          VITE_BASE_PATH: /ThreatWeave/
        run: |
          npm install
          npm run build
      - name: Verify built portfolio
        run: |
          test -s frontend/dist/index.html
          find frontend/dist/assets -type f -name "*.js" -print -quit | grep -q .
          if grep -R -q "detectionops-api.onrender.com" frontend/dist/assets; then
            echo "::error::Legacy Render API URL found in built frontend"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published portfolio and refreshed datasets
        run: |
          set -euo pipefail
          BASE="https://shikhasahu-23.github.io/ThreatWeave"
          for path in "/" "/data/summary.json" "/data/indicators.json" "/data/feeds.json" "/data/attack-techniques.json"; do
            curl --fail --silent --show-error --retry 5 --retry-delay 5 "${BASE}${path}" -o /tmp/published
            test -s /tmp/published
            echo "PASS ${path}"
          done
