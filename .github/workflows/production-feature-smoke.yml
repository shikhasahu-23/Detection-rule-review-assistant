name: Production feature smoke tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-feature-smoke.yml"
      - "backend/**"
      - "frontend/src/App.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-api:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production feature APIs
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://detectionops-api.onrender.com"
          check_json() {
            local path="$1"
            local expected="$2"
            local name="$3"
            local file
            file="$(mktemp)"
            echo "Checking ${name}: GET ${path}"
            curl --fail --silent --show-error --retry 3 --retry-delay 5 "${BASE}${path}" -o "${file}"
            if [[ "${expected}" == "array" ]]; then
              jq -e 'type == "array"' "${file}" >/dev/null
            else
              jq -e 'type == "object"' "${file}" >/dev/null
            fi
            echo "PASS ${name}"
          }

          check_json "/api/v1/intelligence/summary" object "Overview summary"
          check_json "/api/v1/intelligence/indicators?limit=5" array "Threat indicator inventory"
          check_json "/api/v1/intelligence/feeds" array "Feed activity"
          check_json "/api/v1/intelligence/pipeline/runs?limit=5" array "Pipeline history"
          check_json "/api/v1/intelligence/attack-techniques?limit=5" array "MITRE ATT&CK catalog"
          check_json "/api/v1/intelligence/detection-opportunities?limit=5" array "Intelligence correlation"
          check_json "/api/v1/intelligence/threat-graph?limit=5" object "Threat graph"
          check_json "/api/v1/detection-intents?limit=5" array "Detection intents"
          check_json "/api/v1/detection-effectiveness" object "Detection effectiveness"
          check_json "/api/v1/rules?limit=5" array "Rule library"

          curl --fail --silent --show-error "${BASE}/openapi.json" -o /tmp/openapi.json
          jq -e '.paths["/api/v1/detection-intents"].get and .paths["/api/v1/detection-intents"].post and .paths["/api/v1/rules"].get and .paths["/api/v1/detection-effectiveness"].get' /tmp/openapi.json >/dev/null
          echo "PASS OpenAPI route registration"

          ORIGIN="https://shikhasahu-23.github.io"
          curl --fail --silent --show-error -D /tmp/cors.txt -o /dev/null -X OPTIONS "${BASE}/api/v1/detection-intents" \
            -H "Origin: ${ORIGIN}" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type"
          grep -i -F "access-control-allow-origin: ${ORIGIN}" /tmp/cors.txt
          echo "PASS browser CORS for detection-intent workflow"
