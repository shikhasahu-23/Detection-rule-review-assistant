name: Static portfolio smoke tests

on:
  push:
    branches: [main, migration/github-only]
    paths:
      - "frontend/**"
      - "scripts/refresh_static_intelligence.py"
      - ".github/workflows/production-feature-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed public datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("frontend/public/data")
          for name in ("summary.json", "indicators.json", "feeds.json", "attack-techniques.json", "detection-intents.json", "threat-graph.json", "pipeline-runs.json"):
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, f"Missing/empty {name}"
              json.loads(path.read_text())
          rules = []
          for part in range(1, 7):
              rows = json.loads((root / f"rules-{part}.json").read_text())
              assert isinstance(rows, list), f"rules-{part}.json is not an array"
              rules.extend(rows)
          assert len(rules) == 344, f"Expected 344 exported rules, got {len(rules)}"
          print(f"PASS static datasets; {len(rules)} rule records")
          PY
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          VITE_BASE_PATH=/ThreatWeave/ npm run build
      - name: Verify no backend URL remains in bundle
        run: |
          if grep -R -q "detectionops-api.onrender.com" frontend/dist/assets; then
            echo "::error::Frontend still references Render API"
            exit 1
          fi
