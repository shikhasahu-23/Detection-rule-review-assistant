name: Populate production workspace

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-populate.yml"
      - "backend/**"
      - "frontend/src/App.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Seed a useful detection workflow and verify write paths
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://detectionops-api.onrender.com"
          TITLE="Encoded PowerShell execution with suspicious download"
          INTENT_JSON="$(mktemp)"
          curl --fail --silent --show-error "${BASE}/api/v1/detection-intents?q=$(python -c 'import urllib.parse; print(urllib.parse.quote("Encoded PowerShell execution with suspicious download"))')" -o "${INTENT_JSON}"
          INTENT_ID="$(jq -r --arg title "${TITLE}" '.[] | select(.title == $title) | .id' "${INTENT_JSON}" | head -n1)"
          if [[ -z "${INTENT_ID}" ]]; then
            cat > /tmp/intent.json <<'JSON'
          {
            "title": "Encoded PowerShell execution with suspicious download",
            "description": "Detect PowerShell launched with encoded command content or download-capable arguments, which may indicate script-based execution and payload retrieval.",
            "behavior": "Identify process creation events for powershell.exe or pwsh.exe with encoded-command switches (-enc, -encodedcommand) or download-related commands such as DownloadString, Invoke-WebRequest, or bitsadmin. Correlate parent process, command line and destination indicators for analyst triage.",
            "severity": "high",
            "attack_techniques": ["T1059.001", "T1105"],
            "required_telemetry": [
              {"source":"endpoint","description":"Windows process creation telemetry","required_fields":["process_name","command_line","parent_process_name"]},
              {"source":"network","description":"Outbound connection telemetry","required_fields":["destination_ip","destination_port"]}
            ],
            "evidence": [
              {"kind":"cve","reference":"CVE-2021-44228","source":"CISA Known Exploited Vulnerabilities","confidence":100}
            ],
            "test_scenarios": ["Encoded PowerShell command execution","Benign PowerShell without encoded or download arguments"],
            "target_platforms": ["splunk","sentinel"]
          }
          JSON
            curl --fail --silent --show-error -H "Content-Type: application/json" -d @/tmp/intent.json "${BASE}/api/v1/detection-intents" -o /tmp/created-intent.json
            INTENT_ID="$(jq -r '.id' /tmp/created-intent.json)"
            test -n "${INTENT_ID}" && test "${INTENT_ID}" != "null"
            echo "PASS created production detection intent ${INTENT_ID}"
          else
            echo "PASS reused existing production detection intent ${INTENT_ID}"
          fi

          curl --fail --silent --show-error "${BASE}/api/v1/detection-intents/${INTENT_ID}/candidates" -o /tmp/candidates.json
          CANDIDATE_ID="$(jq -r '.[0].id // empty' /tmp/candidates.json)"
          if [[ -z "${CANDIDATE_ID}" ]]; then
            cat > /tmp/candidate.json <<'JSON'
          {
            "name": "Encoded PowerShell and download behavior (Splunk)",
            "platform": "splunk",
            "query": "index=* (process_name=\"powershell.exe\" OR process_name=\"pwsh.exe\") (command_line=\"*-enc*\" OR command_line=\"*DownloadString*\" OR command_line=\"*Invoke-WebRequest*\") | stats count values(parent_process_name) as parent_process_name values(destination_ip) as destination_ip by host process_name command_line"
          }
          JSON
            curl --fail --silent --show-error -H "Content-Type: application/json" -d @/tmp/candidate.json "${BASE}/api/v1/detection-intents/${INTENT_ID}/candidates" -o /tmp/created-candidate.json
            CANDIDATE_ID="$(jq -r '.id' /tmp/created-candidate.json)"
            test -n "${CANDIDATE_ID}" && test "${CANDIDATE_ID}" != "null"
            echo "PASS created reviewed-only Splunk rule candidate ${CANDIDATE_ID}"
          else
            echo "PASS reused existing rule candidate ${CANDIDATE_ID}"
          fi

          cat > /tmp/test-suite.json <<'JSON'
          {
            "cases": [
              {"name":"Encoded PowerShell signal is present","scenario_type":"positive","fixture":{"process_name":"powershell.exe","command_line":"powershell.exe -enc SQBFAFgA"},"assertions":[{"operator":"contains","value":"powershell.exe"},{"operator":"contains","value":"command_line"}]},
              {"name":"Download behavior is represented","scenario_type":"positive","fixture":{"process_name":"pwsh.exe","command_line":"Invoke-WebRequest https://example.invalid/payload"},"assertions":[{"operator":"contains","value":"Invoke-WebRequest"},{"operator":"contains","value":"destination_ip"}]},
              {"name":"No unresolved placeholder remains","scenario_type":"edge","fixture":{},"assertions":[{"operator":"not_contains","value":"replace_me"},{"operator":"not_contains","value":"TODO:"}]}
            ]
          }
          JSON
          curl --fail --silent --show-error -H "Content-Type: application/json" -d @/tmp/test-suite.json "${BASE}/api/v1/rules/${CANDIDATE_ID}/test-runs" -o /tmp/test-result.json
          jq -e '.status == "passed" and .passed_cases == .total_cases and .failed_cases == 0' /tmp/test-result.json >/dev/null
          echo "PASS offline rule test suite: $(jq -r '.passed_cases' /tmp/test-result.json)/$(jq -r '.total_cases' /tmp/test-result.json)"

          echo "INTENT_ID=${INTENT_ID}" >> "${GITHUB_ENV}"
          echo "CANDIDATE_ID=${CANDIDATE_ID}" >> "${GITHUB_ENV}"

      - name: Import source-backed MITRE ATT&CK STIX graph subset
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://detectionops-api.onrender.com"
          python - <<'PY'
          import json
          import urllib.request
          from collections import Counter

          url = "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json"
          request = urllib.request.Request(url, headers={"User-Agent": "ThreatWeave-production-verification/1.0"})
          with urllib.request.urlopen(request, timeout=90) as response:
              bundle = json.loads(response.read(100_000_000).decode("utf-8"))

          supported = {"malware", "tool", "infrastructure", "vulnerability"}
          entities = [obj for obj in bundle.get("objects", []) if isinstance(obj, dict) and obj.get("type") in supported and isinstance(obj.get("id"), str) and isinstance(obj.get("name"), str)]
          by_id = {obj["id"]: obj for obj in entities}
          relationships = [obj for obj in bundle.get("objects", []) if isinstance(obj, dict) and obj.get("type") == "relationship" and obj.get("source_ref") in by_id and obj.get("target_ref") in by_id]
          degree = Counter()
          for rel in relationships:
              degree[rel["source_ref"]] += 1
              degree[rel["target_ref"]] += 1
          selected_ids = {item_id for item_id, _ in degree.most_common(100)}
          if not selected_ids:
              selected_ids = {obj["id"] for obj in entities[:100]}
          selected_nodes = [by_id[item_id] for item_id in selected_ids]
          selected_relationships = [rel for rel in relationships if rel["source_ref"] in selected_ids and rel["target_ref"] in selected_ids][:500]
          objects = selected_nodes + selected_relationships
          if not selected_nodes:
              raise SystemExit("MITRE ATT&CK STIX bundle had no supported graph entities")
          with open("/tmp/mitre-graph.json", "w", encoding="utf-8") as handle:
              json.dump({"type":"bundle","spec_version":"2.1","id":"bundle--00000000-0000-4000-8000-000000000001","objects":objects}, handle)
          print(f"Selected {len(selected_nodes)} official entities and {len(selected_relationships)} source relationships")
          PY
          jq --arg source_name "MITRE ATT&CK Enterprise" '. + {source_name: $source_name}' /tmp/mitre-graph.json > /tmp/stix-import.json
          curl --fail --silent --show-error --retry 3 --retry-delay 5 -H "Content-Type: application/json" \
            --data-binary @/tmp/stix-import.json \
            "${BASE}/api/v1/intelligence/feeds/custom/stix" -o /tmp/stix-result.json
          jq -e '.entities_created + .entities_updated > 0' /tmp/stix-result.json >/dev/null
          echo "PASS STIX import: $(jq -r '.entities_created' /tmp/stix-result.json) new entities, $(jq -r '.relationships_created' /tmp/stix-result.json) new relationships"

      - name: Run live feed ingestion, enrichment and correlation pipeline
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://detectionops-api.onrender.com"
          curl --fail --silent --show-error -X POST "${BASE}/api/v1/intelligence/pipeline/runs" -o /tmp/pipeline-queued.json
          echo "Pipeline accepted: $(cat /tmp/pipeline-queued.json)"
          for attempt in $(seq 1 90); do
            curl --fail --silent --show-error "${BASE}/api/v1/intelligence/pipeline/runs?limit=5" -o /tmp/pipeline-runs.json
            STATUS="$(jq -r '.[0].status // empty' /tmp/pipeline-runs.json)"
            if [[ "${STATUS}" == "succeeded" || "${STATUS}" == "partial_success" || "${STATUS}" == "failed" ]]; then
              jq '.[0] | {run_id,status,indicators_enriched,opportunities_found,candidates_created,candidates_skipped,stage_results,error_message}' /tmp/pipeline-runs.json
              if [[ "${STATUS}" == "failed" ]]; then exit 1; fi
              exit 0
            fi
            sleep 10
          done
          echo "Pipeline did not reach a terminal state within 15 minutes"
          exit 1

      - name: Verify every workspace page has useful production data
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://detectionops-api.onrender.com"
          curl --fail --silent --show-error "${BASE}/api/v1/intelligence/summary" -o /tmp/summary.json
          curl --fail --silent --show-error "${BASE}/api/v1/intelligence/indicators?limit=5" -o /tmp/indicators.json
          curl --fail --silent --show-error "${BASE}/api/v1/intelligence/feeds" -o /tmp/feeds.json
          curl --fail --silent --show-error "${BASE}/api/v1/intelligence/pipeline/runs?limit=5" -o /tmp/runs.json
          curl --fail --silent --show-error "${BASE}/api/v1/intelligence/attack-techniques?limit=5" -o /tmp/attack.json
          curl --fail --silent --show-error "${BASE}/api/v1/intelligence/detection-opportunities?limit=5" -o /tmp/opportunities.json
          curl --fail --silent --show-error "${BASE}/api/v1/intelligence/threat-graph?limit=100" -o /tmp/graph.json
          curl --fail --silent --show-error "${BASE}/api/v1/detection-intents?limit=5" -o /tmp/intents.json
          curl --fail --silent --show-error "${BASE}/api/v1/detection-effectiveness" -o /tmp/effectiveness.json
          curl --fail --silent --show-error "${BASE}/api/v1/rules?limit=5" -o /tmp/rules.json

          jq -e '.indicators_total > 0 and .active_indicators > 0 and .sources_total > 0' /tmp/summary.json >/dev/null
          jq -e 'length > 0' /tmp/indicators.json >/dev/null
          jq -e 'length > 0' /tmp/feeds.json >/dev/null
          jq -e 'length > 0' /tmp/runs.json >/dev/null
          jq -e 'length > 0' /tmp/attack.json >/dev/null
          jq -e '.nodes | length > 0' /tmp/graph.json >/dev/null
          jq -e 'length > 0' /tmp/intents.json >/dev/null
          jq -e 'length > 0' /tmp/rules.json >/dev/null
          jq -e '(.metrics // .summary // .) | type == "object"' /tmp/effectiveness.json >/dev/null
          jq -e 'length > 0' /tmp/opportunities.json >/dev/null

          echo "PASS Overview: $(jq -r '.active_indicators' /tmp/summary.json) active indicators"
          echo "PASS Threat intelligence: $(jq length /tmp/indicators.json) indicators, $(jq length /tmp/feeds.json) feeds"
          echo "PASS Correlation: $(jq length /tmp/opportunities.json) opportunities"
          echo "PASS Threat graph: $(jq '.nodes|length' /tmp/graph.json) entities, $(jq '.edges|length' /tmp/graph.json) relationships"
          echo "PASS ATT&CK catalog: $(jq length /tmp/attack.json) techniques returned"
          echo "PASS Rule generator / validation / review queue: $(jq length /tmp/intents.json) intents"
          echo "PASS Rule library: $(jq length /tmp/rules.json) candidates"
          echo "PASS Effectiveness endpoint responds with structured metrics"
