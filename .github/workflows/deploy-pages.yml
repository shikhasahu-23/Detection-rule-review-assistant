name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/refresh_static_intelligence.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build static portfolio
        env:
          VITE_BASE_PATH: /ThreatWeave/
        run: npm run build
      - name: Verify static data and no Render API dependency
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -s public/data/summary.json
          test -s public/data/indicators.json
          test -s public/data/attack-techniques.json
          test -s public/data/detection-intents.json
          for part in 1 2 3 4 5 6; do test -s "public/data/rules-${part}.json"; done
          if grep -R -q "detectionops-api.onrender.com" dist/assets; then
            echo "::error::Render API URL remains in frontend bundle"
            exit 1
          fi
          echo "Static portfolio bundle and data files verified."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: https://shikhasahu-23.github.io/ThreatWeave/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Verify published static portfolio
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check GitHub Pages and static datasets
        run: |
          set -euo pipefail
          BASE="https://shikhasahu-23.github.io/ThreatWeave"
          for path in "/" "/data/summary.json" "/data/indicators.json" "/data/attack-techniques.json" "/data/detection-intents.json" "/data/rules-1.json" "/data/rules-6.json"; do
            curl --fail --silent --show-error --retry 5 --retry-delay 5 "${BASE}${path}" -o /tmp/check
            test -s /tmp/check
            echo "PASS ${path}"
          done
