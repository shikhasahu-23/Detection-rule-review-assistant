name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        env:
          VITE_BASE_PATH: /ThreatWeave/
          VITE_API_BASE_URL: https://detectionops-api.onrender.com
        run: npm run build

      - name: Verify build output
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -R -q "https://detectionops-api.onrender.com" dist/assets
          echo "Frontend build output and production API URL verified."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: https://shikhasahu-23.github.io/ThreatWeave/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Verify live frontend and backend
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check published frontend
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error https://shikhasahu-23.github.io/ThreatWeave/ -o /tmp/threatweave.html; then
              break
            fi
            echo "GitHub Pages not ready yet (attempt ${attempt}/12); retrying..."
            sleep 10
          done
          test -s /tmp/threatweave.html
          grep -q "ThreatWeave" /tmp/threatweave.html
          echo "GitHub Pages frontend returned HTTP 200."

      - name: Check backend health and readiness
        run: |
          set -euo pipefail
          for endpoint in health ready; do
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "https://detectionops-api.onrender.com/${endpoint}" -o "/tmp/${endpoint}.json"; then
                break
              fi
              echo "Backend /${endpoint} not ready yet (attempt ${attempt}/12); retrying..."
              sleep 10
            done
            test -s "/tmp/${endpoint}.json"
            cat "/tmp/${endpoint}.json"
          done

      - name: Verify API route and browser CORS
        run: |
          set -euo pipefail
          API_URL="https://detectionops-api.onrender.com/api/v1/intelligence/summary"
          curl --fail --silent --show-error "${API_URL}" -o /tmp/summary.json
          cat /tmp/summary.json
          ORIGIN="https://shikhasahu-23.github.io"
          curl --fail --silent --show-error -D /tmp/cors-headers.txt -o /dev/null -X OPTIONS "${API_URL}" \
            -H "Origin: ${ORIGIN}" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: content-type"
          grep -i -F "access-control-allow-origin: ${ORIGIN}" /tmp/cors-headers.txt
          echo "Backend route and GitHub Pages CORS preflight passed."
